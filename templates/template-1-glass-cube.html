<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design World — Explore New Ideas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --pad-x: clamp(20px, 6.95vw, 120px);
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background: #000;
    }

    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }
    #scene.dragging {
      cursor: grabbing;
    }

    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .ui a, .ui button {
      pointer-events: auto;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* NAV */
    .nav {
      position: absolute;
      top: clamp(24px, 4.7vh, 40px);
      left: var(--pad-x);
      right: var(--pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .logo-mark {
      width: 20px;
      height: 40px;
      background: #fff;
      border-radius: 0 20px 20px 0;
    }
    .logo b { font-weight: 700; }
    .logo span { font-weight: 400; }

    .nav-links {
      display: flex;
      gap: clamp(20px, 4.1vw, 60px);
      list-style: none;
    }
    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      position: relative;
      cursor: pointer;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .35s ease;
    }
    .nav-links a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* ARROWS */
    .arrows {
      position: absolute;
      top: 18.9%;
      left: 76.7%;
      display: flex;
      gap: 32px;
      transform: translate(-19px, -50%);
    }
    .arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      background: transparent;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .25s, color .25s;
    }
    .arrow svg {
      width: 18px;
      height: 18px;
    }
    .arrow:hover {
      background: #fff;
      color: #000;
    }

    /* PAGINATION DOTS */
    .dots {
      position: absolute;
      right: calc(var(--pad-x) - 7px);
      top: 49.4%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 33px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #fff;
      cursor: pointer;
      transition: background .25s;
    }
    .dot.active {
      background: transparent;
    }

    /* TAGLINE */
    .tagline {
      position: absolute;
      left: var(--pad-x);
      bottom: clamp(40px, 7.5vh, 70px);
      font-size: clamp(24px, 2.65vw, 44px);
      line-height: 1.2;
      font-weight: 300;
      letter-spacing: -0.01em;
    }
    .tagline strong {
      font-weight: 700;
      display: block;
    }

    /* CTA ROW */
    .cta-row {
      position: absolute;
      left: 45.6%;
      right: -1vw;
      top: 88.7%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
    }
    .cta {
      flex: none;
      padding: 0 15px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      border: 1.5px solid rgba(255, 255, 255, .85);
      border-radius: 6px;
      background: rgba(0, 0, 0, .15);
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
      transition: background .25s, color .25s;
    }
    .cta:hover {
      background: #fff;
      color: #000;
    }
    .cta-line {
      flex: 1;
      height: 1.5px;
      background: rgba(255, 255, 255, .8);
      min-width: 40px;
    }
    .count {
      flex: none;
      font-size: clamp(140px, 19.8vw, 360px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, .9);
      transform: translateY(6%);
      user-select: none;
    }

    /* LOADER */
    .loader {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .6;
      transition: opacity .6s;
      pointer-events: none;
    }
    .loader.done {
      opacity: 0;
    }

    /* RESPONSIVE */
    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      .arrows {
        left: auto;
        right: var(--pad-x);
        top: 15%;
        transform: translateY(-50%);
        gap: 14px;
      }
      .tagline {
        bottom: clamp(150px, 20vh, 220px);
      }
      .cta-row {
        left: var(--pad-x);
        right: -3vw;
        top: auto;
        bottom: 24px;
        transform: none;
      }
      .count {
        font-size: clamp(120px, 22vw, 200px);
      }
    }
    @media (max-width: 640px) {
      .nav-links {
        gap: 16px;
      }
      .nav-links a, .logo {
        font-size: 13px;
      }
      .dots {
        gap: 20px;
        right: 16px;
      }
      .dot {
        width: 10px;
        height: 10px;
      }
      .cta-row {
        right: -8vw;
      }
      .count {
        font-size: 120px;
      }
    }
    @media (max-width: 420px) {
      .nav-links li:nth-child(2) {
        display: none;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <section class="hero" id="hero">
    <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
    <div class="ui">
      <h1 class="sr-only">Explore New Ideas</h1>
      <header class="nav">
        <a href="#" class="logo"><i class="logo-mark"></i><b>Design</b><span>World</span></a>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Portfolio</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>
      </header>
      <div class="arrows">
        <button class="arrow" id="prev" aria-label="Previous view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M11 6l-6 6 6 6" />
          </svg>
        </button>
        <button class="arrow" id="next" aria-label="Next view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </div>
      <nav class="dots">
        <button class="dot" data-index="0" aria-label="Slide 1"></button>
        <button class="dot active" data-index="1" aria-label="Slide 2"></button>
        <button class="dot" data-index="2" aria-label="Slide 3"></button>
      </nav>
      <p class="tagline">Let's Build the<br>Future of <strong>Design.</strong></p>
      <div class="cta-row">
        <a href="#" class="cta">Explore Now</a>
        <span class="cta-line"></span>
        <span class="count" aria-hidden="true">07</span>
      </div>
      <div class="loader" id="loader">Loading model</div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';

    const canvas = document.getElementById('scene');
    const loaderEl = document.getElementById('loader');
    const heroEl = document.getElementById('hero');

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.autoClear = false;

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    const textCanvas = document.createElement('canvas');
    const textCtx = textCanvas.getContext('2d');
    const bgTexture = new THREE.CanvasTexture(textCanvas);
    bgTexture.colorSpace = THREE.SRGBColorSpace;
    bgTexture.minFilter = THREE.LinearFilter;
    bgTexture.magFilter = THREE.LinearFilter;
    bgTexture.generateMipmaps = false;

    const bgScene = new THREE.Scene();
    const bgMat = new THREE.ShaderMaterial({
      uniforms: {
        uTex: { value: bgTexture }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec2 vUv;
        void main() {
          gl_FragColor = texture2D(uTex, vUv);
          #include <colorspace_fragment>
        }
      `,
      depthTest: false,
      depthWrite: false
    });
    const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
    bgQuad.frustumCulled = false;
    bgScene.add(bgQuad);

    let rtBack = new THREE.WebGLRenderTarget(1, 1, {
      type: THREE.HalfFloatType,
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter
    });
    let rtFront = new THREE.WebGLRenderTarget(1, 1, {
      type: THREE.HalfFloatType,
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter
    });

    const glassVertexShader = `
      varying vec3 vNormal;
      varying vec3 vEye;
      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vec4 mvPos = viewMatrix * worldPos;
        gl_Position = projectionMatrix * mvPos;
        vNormal = normalize(normalMatrix * normal);
        vEye = normalize(mvPos.xyz);
      }
    `;

    const glassFragmentShader = `
      uniform sampler2D uTexture;
      uniform vec2 uResolution;
      uniform float uIorR;
      uniform float uIorY;
      uniform float uIorG;
      uniform float uIorC;
      uniform float uIorB;
      uniform float uIorP;
      uniform float uRefractPower;
      uniform float uChromatic;
      uniform float uSaturation;
      uniform float uShininess;
      uniform float uDiffuseness;
      uniform float uFresnelPower;
      uniform vec3 uLight;
      uniform float uBackside;

      varying vec3 vNormal;
      varying vec3 vEye;

      float specularLight(vec3 lightDir, vec3 normal, vec3 eye, float shininess, float diffuseness) {
        vec3 l = normalize(-lightDir);
        vec3 v = -eye;
        vec3 h = normalize(l + v);
        float spec = pow(max(dot(normal, h), 0.0), shininess);
        float diff = max(0.0, dot(normal, l)) * diffuseness;
        return spec + diff;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;
        vec3 n = normalize(vNormal);
        if (uBackside > 0.5) {
          n = -n;
        }
        vec3 eye = normalize(vEye);

        const int LOOP = 16;
        vec3 colorAcc = vec3(0.0);

        for (int i = 0; i < LOOP; i++) {
          float slide = float(i) / float(LOOP) * 0.045;

          vec3 refrR = refract(eye, n, 1.0 / uIorR);
          vec3 refrY = refract(eye, n, 1.0 / uIorY);
          vec3 refrG = refract(eye, n, 1.0 / uIorG);
          vec3 refrC = refract(eye, n, 1.0 / uIorC);
          vec3 refrB = refract(eye, n, 1.0 / uIorB);
          vec3 refrP = refract(eye, n, 1.0 / uIorP);

          vec2 uvR = uv + refrR.xy * (uRefractPower + slide * 1.0) * uChromatic;
          vec2 uvY = uv + refrY.xy * (uRefractPower + slide * 1.0) * uChromatic;
          vec2 uvG = uv + refrG.xy * (uRefractPower + slide * 2.0) * uChromatic;
          vec2 uvC = uv + refrC.xy * (uRefractPower + slide * 2.5) * uChromatic;
          vec2 uvB = uv + refrB.xy * (uRefractPower + slide * 3.0) * uChromatic;
          vec2 uvP = uv + refrP.xy * (uRefractPower + slide * 1.0) * uChromatic;

          vec4 sR = texture2D(uTexture, uvR);
          vec4 sY = texture2D(uTexture, uvY);
          vec4 sG = texture2D(uTexture, uvG);
          vec4 sC = texture2D(uTexture, uvC);
          vec4 sB = texture2D(uTexture, uvB);
          vec4 sP = texture2D(uTexture, uvP);

          float r = sR.r * 0.5;
          float y = (sY.r * 2.0 + sY.g * 2.0 - sY.b) / 6.0;
          float g = sG.g * 0.5;
          float c = (sC.g * 2.0 + sC.b * 2.0 - sC.r) / 6.0;
          float b = sB.b * 0.5;
          float p = (sP.b * 2.0 + sP.r * 2.0 - sP.g) / 6.0;

          float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
          float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
          float B = b + (2.0 * c + 2.0 * p - y) / 3.0;

          colorAcc += vec3(R, G, B);
        }

        vec3 color = colorAcc / float(LOOP);

        float luma = dot(color, vec3(0.2125, 0.7154, 0.0721));
        color = mix(vec3(luma), color, uSaturation);

        float spec1 = specularLight(uLight, n, eye, uShininess, uDiffuseness);
        float spec2 = specularLight(vec3(1.0, 1.0, -1.0), n, eye, uShininess * 0.6, uDiffuseness * 0.5);
        float spec = spec1 + 0.6 * spec2;
        color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

        float f = pow(clamp(1.0 + dot(eye, n), 0.0, 1.0), uFresnelPower);
        color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));

        color += vec3(0.004, 0.005, 0.007);

        gl_FragColor = vec4(color, 1.0);
        #include <colorspace_fragment>
      }
    `;

    function createGlassMaterial(isBack) {
      return new THREE.ShaderMaterial({
        vertexShader: glassVertexShader,
        fragmentShader: glassFragmentShader,
        uniforms: {
          uTexture: { value: null },
          uResolution: { value: new THREE.Vector2() },
          uIorR: { value: 1.15 },
          uIorY: { value: 1.16 },
          uIorG: { value: 1.18 },
          uIorC: { value: 1.22 },
          uIorB: { value: 1.22 },
          uIorP: { value: 1.22 },
          uRefractPower: { value: isBack ? 0.22 : 0.30 },
          uChromatic: { value: 0.5 },
          uSaturation: { value: 1.08 },
          uShininess: { value: 90.0 },
          uDiffuseness: { value: 0.02 },
          uFresnelPower: { value: 5.0 },
          uLight: { value: new THREE.Vector3(-1.0, 1.0, 1.0).normalize() },
          uBackside: { value: isBack ? 1.0 : 0.0 }
        },
        side: isBack ? THREE.BackSide : THREE.FrontSide,
        depthWrite: !isBack,
        depthTest: true
      });
    }

    const backMat = createGlassMaterial(true);
    const frontMat = createGlassMaterial(false);

    const mainScene = new THREE.Scene();
    const pivot = new THREE.Group();
    const spinner = new THREE.Group();
    spinner.rotation.set(-0.42, 0.62, 0.18);
    pivot.add(spinner);
    mainScene.add(pivot);

    let cubeMesh = null;

    function buildCube(geom) {
      geom.computeBoundingBox();
      const bbox = geom.boundingBox;
      const size = new THREE.Vector3();
      bbox.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      geom.center();
      geom.scale(1 / maxDim, 1 / maxDim, 1 / maxDim);

      cubeMesh = new THREE.Mesh(geom, frontMat);
      spinner.add(cubeMesh);
      loaderEl.classList.add('done');
    }

    const gltfLoader = new GLTFLoader();
    gltfLoader.load(
      MODEL_URL,
      (gltf) => {
        const geometries = [];
        gltf.scene.updateMatrixWorld(true);
        gltf.scene.traverse((child) => {
          if (child.isMesh && child.geometry) {
            const g = child.geometry.clone();
            g.deleteAttribute('uv');
            g.deleteAttribute('color');
            g.deleteAttribute('tangent');
            const merged = BufferGeometryUtils.mergeVertices(g, 1e-4);
            merged.computeVertexNormals();
            merged.applyMatrix4(child.matrixWorld);
            geometries.push(merged);
          }
        });

        if (geometries.length > 0) {
          const finalGeom = BufferGeometryUtils.mergeGeometries(geometries, false);
          buildCube(finalGeom);
        } else {
          fallbackCube();
        }
      },
      undefined,
      (err) => {
        console.warn('GLB load failed, using fallback RoundedBox:', err);
        fallbackCube();
      }
    );

    function fallbackCube() {
      const geom = new RoundedBoxGeometry(1, 1, 1, 8, 0.12);
      buildCube(geom);
    }

    function drawHeadline(w, h, dpr) {
      textCanvas.width = Math.floor(w * dpr);
      textCanvas.height = Math.floor(h * dpr);

      textCtx.save();
      textCtx.scale(dpr, dpr);
      textCtx.fillStyle = '#000000';
      textCtx.fillRect(0, 0, w, h);

      const mobile = (w < 768) || (w / h < 1);
      let fs = Math.min(h * 0.21, w * (mobile ? 0.21 : 0.118));
      textCtx.font = `800 ${fs}px Poppins`;

      const lines = ['Explore', 'New', 'Ideas'];
      let maxLineWidth = 0;
      for (const line of lines) {
        maxLineWidth = Math.max(maxLineWidth, textCtx.measureText(line).width);
      }
      const allowedWidth = w * (mobile ? 0.9 : 0.5);
      if (maxLineWidth > allowedWidth && maxLineWidth > 0) {
        fs *= (allowedWidth / maxLineWidth);
        textCtx.font = `800 ${fs}px Poppins`;
      }

      const cx = w * (mobile ? 0.5 : 0.505);
      const cy = h * (mobile ? 0.45 : 0.468);
      const gap = fs * 1.07;
      const cap = fs * 0.7;

      textCtx.fillStyle = '#e9e9e9';
      textCtx.textAlign = 'center';
      textCtx.textBaseline = 'alphabetic';

      for (let i = 0; i < 3; i++) {
        const baselineY = cy + cap * 0.5 + (i - 1) * gap;
        textCtx.fillText(lines[i], cx, baselineY);
      }
      textCtx.restore();

      bgTexture.needsUpdate = true;
    }

    let currentW = 1;
    let currentH = 1;
    let currentDpr = 1;

    function layout() {
      const rect = heroEl.getBoundingClientRect();
      const w = Math.max(rect.width, 1);
      const h = Math.max(rect.height, 1);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      currentW = w;
      currentH = h;
      currentDpr = dpr;

      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h, false);

      const bw = Math.floor(w * dpr);
      const bh = Math.floor(h * dpr);
      rtBack.setSize(bw, bh);
      rtFront.setSize(bw, bh);

      backMat.uniforms.uResolution.value.set(bw, bh);
      frontMat.uniforms.uResolution.value.set(bw, bh);

      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      drawHeadline(w, h, dpr);

      const fovRad = (camera.fov * Math.PI) / 180;
      const visH = 2 * Math.tan(fovRad / 2) * 10;
      const visW = visH * camera.aspect;

      const mobile = (w < 768) || (w / h < 1);
      const sx = mobile ? 0.5 : 0.517;
      const sy = mobile ? 0.45 : 0.488;

      pivot.position.set(
        (sx - 0.5) * visW,
        (0.5 - sy) * visH,
        0
      );

      const px = Math.min(h * 0.44, w * (mobile ? 0.45 : 0.29));
      const s = (px / h) * visH;
      pivot.scale.set(s, s, s);
    }

    window.addEventListener('resize', layout);
    document.fonts.addEventListener('loadingdone', () => drawHeadline(currentW, currentH, currentDpr));

    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let velX = 0;
    let velY = 0;
    let targetSpinY = 0;
    let timeSinceDrag = 0;

    const rotAxisX = new THREE.Vector3(1, 0, 0);
    const rotAxisY = new THREE.Vector3(0, 1, 0);
    const qTemp = new THREE.Quaternion();

    function applyWorldRotation(dx, dy) {
      qTemp.setFromAxisAngle(rotAxisY, dx);
      spinner.quaternion.premultiply(qTemp);
      qTemp.setFromAxisAngle(rotAxisX, dy);
      spinner.quaternion.premultiply(qTemp);
    }

    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      targetSpinY = 0;
      velX = 0;
      velY = 0;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('dragging');
      timeSinceDrag = 0;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = (e.clientX - lastPointerX) * 0.008;
      const dy = (e.clientY - lastPointerY) * 0.008;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      applyWorldRotation(dx, dy);
      velX = dx;
      velY = dy;
      timeSinceDrag = 0;
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      canvas.classList.remove('dragging');
      try {
        canvas.releasePointerCapture(e.pointerId);
      } catch (_) {}
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    prevBtn.addEventListener('click', () => {
      velX = 0;
      velY = 0;
      targetSpinY -= Math.PI / 2;
      timeSinceDrag = 0;
    });

    nextBtn.addEventListener('click', () => {
      velX = 0;
      velY = 0;
      targetSpinY += Math.PI / 2;
      timeSinceDrag = 0;
    });

    const dots = document.querySelectorAll('.dot');
    dots.forEach((dot) => {
      dot.addEventListener('click', () => {
        dots.forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
      });
    });

    let lastTime = performance.now();

    function renderLoop(now) {
      requestAnimationFrame(renderLoop);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (!isDragging) {
        timeSinceDrag += dt;

        if (Math.abs(targetSpinY) > 0.0005) {
          const step = targetSpinY * Math.min(1, 0.09 * dt * 60);
          targetSpinY -= step;
          applyWorldRotation(step, 0);
        } else {
          targetSpinY = 0;

          if (Math.abs(velX) > 0.00001 || Math.abs(velY) > 0.00001) {
            applyWorldRotation(velX, velY);
            const damp = Math.pow(0.94, dt * 60);
            velX *= damp;
            velY *= damp;
          }

          if (timeSinceDrag > 0.6) {
            const blend = Math.min((timeSinceDrag - 0.6) / 1.0, 1.0);
            const driftY = 0.0035 * blend * (dt * 60);
            const driftX = 0.0012 * blend * (dt * 60);
            applyWorldRotation(driftY, driftX);
          }
        }
      }

      if (!cubeMesh) {
        renderer.render(bgScene, quadCamera);
        return;
      }

      // Pass 1: Render background scene into rtBack
      renderer.setRenderTarget(rtBack);
      renderer.clear();
      renderer.render(bgScene, quadCamera);

      // Pass 2: Render background scene into rtFront, then cube with backMat into rtFront
      backMat.uniforms.uTexture.value = rtBack.texture;
      cubeMesh.material = backMat;

      renderer.setRenderTarget(rtFront);
      renderer.clear();
      renderer.render(bgScene, quadCamera);
      renderer.render(mainScene, camera);

      // Pass 3: Render background scene into screen, clear depth, then cube with frontMat into screen
      frontMat.uniforms.uTexture.value = rtFront.texture;
      cubeMesh.material = frontMat;

      renderer.setRenderTarget(null);
      renderer.clear();
      renderer.render(bgScene, quadCamera);
      renderer.clearDepth();
      renderer.render(mainScene, camera);
    }

    const fontPromise = Promise.race([
      Promise.all([
        document.fonts.load('800 100px Poppins'),
        document.fonts.ready
      ]),
      new Promise(resolve => setTimeout(resolve, 2500))
    ]);

    fontPromise.then(() => {
      layout();
      lastTime = performance.now();
      requestAnimationFrame(renderLoop);
    });
  </script>
</body>
</html>
