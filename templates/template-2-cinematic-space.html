    // FadingVideo Component with custom JS rAF crossfade
    function FadingVideo({ src, className, style }) {
      const videoRef = useRef(null);
      const fadingOutRef = useRef(false);
      const rafIdRef = useRef(null);

      const FADE_MS = 500;
      const FADE_OUT_LEAD = 0.55;

      const fadeTo = (targetOpacity, duration = FADE_MS) => {
        if (!videoRef.current) return;
        if (rafIdRef.current) {
          cancelAnimationFrame(rafIdRef.current);
        }

        const currentOpacity = parseFloat(videoRef.current.style.opacity || 0);
        const startTime = performance.now();

        const step = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const opacity = currentOpacity + (targetOpacity - currentOpacity) * progress;

          if (videoRef.current) {
            videoRef.current.style.opacity = opacity;
          }

          if (progress < 1) {
            rafIdRef.current = requestAnimationFrame(step);
          }
        };

        rafIdRef.current = requestAnimationFrame(step);
      };

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        video.style.opacity = '0';

        const handleLoadedData = () => {
          video.style.opacity = '0';
          video.play().catch(() => {});
          fadeTo(1, FADE_MS);
        };

        const handleTimeUpdate = () => {
          if (!video.duration) return;
          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        };

        const handleEnded = () => {
          video.style.opacity = '0';
          setTimeout(() => {
            if (!videoRef.current) return;
            video.currentTime = 0;
            video.play().catch(() => {});
            fadingOutRef.current = false;
            fadeTo(1, FADE_MS);
          }, 100);
        };

        video.addEventListener('loadeddata', handleLoadedData);
        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('ended', handleEnded);

        return () => {
          if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);
          video.removeEventListener('loadeddata', handleLoadedData);
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('ended', handleEnded);
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          src={src}
          autoPlay
          muted
          playsInline
          preload="auto"
          className={className}
          style={style}
        />
      );
    }

    // BlurText Component
    function BlurText({ text, className }) {
      const containerRef = useRef(null);
      const [isVisible, setIsVisible] = useState(false);

      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setIsVisible(true);
            }
          },
          { threshold: 0.1 }
        );

        if (containerRef.current) {
          observer.observe(containerRef.current);
        }

        return () => observer.disconnect();
      }, []);

      const words = text.split(" ");

      return (
        <p
          ref={containerRef}
          className={className}
          style={{
            display: "flex",
            flexWrap: "wrap",
            justifyContent: "center",
            rowGap: "0.1em"
          }}
        >
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              animate={isVisible ? {
                filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                opacity: [0, 0.5, 1],
                y: [50, -5, 0]
              } : {}}
              transition={{
                duration: 0.7,
                times: [0, 0.5, 1],
                ease: "easeOut",
                delay: (i * 100) / 1000
              }}
              style={{
                display: "inline-block",
                marginRight: "0.28em"
              }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }
