server.address=0.0.0.0
server.port=${PORT:8080}
server.servlet.context-path=/api
server.error.include-message=never

# Defaults to H2 in-memory database for zero-setup local dev, uses PostgreSQL if PGHOST is configured
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:finditdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${PGUSER:sa}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false
findit.seed-demo=${SEED_DEMO:true}
